<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Johnny Clothing</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Tenor+Sans&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #F7F5F2;
      --white: #FDFCFA;
      --ink: #1E1E1C;
      --mid: #8A8880;
      --light: #C8C5BF;
      --rule: #E2DFD9;
      --stone: #EAE7E1;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Tenor Sans', sans-serif;
      font-weight: 400;
      overflow-x: hidden;
    }

    /* ---- NAV ---- */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 1.6rem 3rem;
      background: rgba(247,245,242,0.94);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--rule);
    }

    .nav-left { display: flex; gap: 2.4rem; }
    .nav-left a, .nav-right-links a {
      text-decoration: none;
      color: var(--mid);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: color 0.25s;
    }
    .nav-left a:hover, .nav-right-links a:hover { color: var(--ink); }

    .nav-logo {
      text-align: center;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.45rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--ink);
      text-decoration: none;
    }

    .nav-right {
      display: flex; gap: 2.4rem; justify-content: flex-end; align-items: center;
    }
    .nav-right-links { display: flex; gap: 2.4rem; }
    .nav-cart {
      font-family: 'Tenor Sans', sans-serif;
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
      background: none; border: none; cursor: pointer;
      transition: color 0.25s;
    }
    .nav-cart:hover { color: var(--ink); }

    /* ---- HERO ---- */
    .hero {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 1fr 1fr;
      padding-top: 5.5rem;
    }

    .hero-left {
      position: relative;
      overflow: hidden;
      background: var(--stone);
    }
    .hero-img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      opacity: 0.88;
      transition: transform 8s ease;
    }
    .hero-left:hover .hero-img { transform: scale(1.03); }
    .hero-img-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(30,30,28,0.38) 0%, transparent 60%);
    }
    .hero-caption {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 2.5rem;
      color: var(--white);
      z-index: 2;
    }
    .hero-season {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0.7;
      margin-bottom: 0.6rem;
    }
    .hero-caption h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2.2rem;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }

    .hero-right {
      display: flex; flex-direction: column; justify-content: center;
      padding: 4rem 4rem 4rem 5rem;
      background: var(--white);
    }
    .hero-right-inner {
      max-width: 400px;
      opacity: 0;
      transform: translateY(20px);
      animation: rise 1s ease 0.3s forwards;
    }
    @keyframes rise { to { opacity:1; transform:none; } }

    .overline {
      font-size: 0.65rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--mid);
      margin-bottom: 2rem;
      display: block;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(2.8rem, 4.5vw, 4.2rem);
      line-height: 1.12;
      letter-spacing: 0.02em;
      margin-bottom: 1.8rem;
      color: var(--ink);
    }
    h1 em { font-style: italic; }

    .hero-body {
      font-size: 1rem;
      color: var(--mid);
      line-height: 1.85;
      margin-bottom: 3rem;
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
    }

    .cta-row { display: flex; gap: 2rem; align-items: center; }

    .btn-primary {
      display: inline-block;
      background: var(--ink);
      color: var(--white);
      padding: 0.85rem 2.2rem;
      text-decoration: none;
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      transition: background 0.3s, letter-spacing 0.3s;
    }
    .btn-primary:hover { background: #3A3A38; letter-spacing: 0.26em; }

    .link-subtle {
      font-size: 0.68rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--mid);
      text-decoration: none;
      border-bottom: 1px solid var(--light);
      padding-bottom: 1px;
      transition: color 0.25s, border-color 0.25s;
    }
    .link-subtle:hover { color: var(--ink); border-color: var(--ink); }

    /* ---- RULE BAR ---- */
    .rule-bar {
      display: flex;
      border-top: 1px solid var(--rule);
      border-bottom: 1px solid var(--rule);
    }
    .rule-item {
      flex: 1;
      padding: 1.1rem 2rem;
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--mid);
      text-align: center;
      border-right: 1px solid var(--rule);
    }
    .rule-item:last-child { border-right: none; }

    /* ---- SECTION ---- */
    .section { padding: 6rem 3rem; }

    .section-header {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-bottom: 3rem;
      border-bottom: 1px solid var(--rule);
      padding-bottom: 1.2rem;
    }
    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2rem;
      letter-spacing: 0.08em;
    }

    /* ---- CATEGORIES ---- */
    .categories { background: var(--white); }

    .cat-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.2rem;
    }
    .cat-card { position: relative; overflow: hidden; cursor: pointer; }
    .cat-img {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      filter: saturate(0.85) brightness(0.96);
      transition: transform 0.7s ease, filter 0.5s ease;
    }
    .cat-card:hover .cat-img { transform: scale(1.04); filter: saturate(1) brightness(1); }
    .cat-label {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 3rem 1.8rem 1.8rem;
      background: linear-gradient(to top, rgba(30,30,28,0.6) 0%, transparent 100%);
      color: white;
    }
    .cat-label h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 1.7rem;
      letter-spacing: 0.1em;
      margin-bottom: 0.15rem;
    }
    .cat-label span {
      font-size: 0.62rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      opacity: 0.7;
    }

    /* ---- PRODUCTS ---- */
    .products { background: var(--bg); }

    .filter-row { display: flex; gap: 0.1rem; }
    .ftab {
      font-family: 'Tenor Sans', sans-serif;
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      padding: 0.5rem 1.2rem;
      background: none;
      border: 1px solid var(--rule);
      color: var(--mid);
      cursor: pointer;
      transition: all 0.2s;
    }
    .ftab.on, .ftab:hover { background: var(--ink); color: var(--white); border-color: var(--ink); }

    .grid4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 2rem 1.4rem;
      margin-top: 3rem;
    }

    .pcard { cursor: pointer; }
    .pcard-img {
      position: relative; overflow: hidden;
      background: var(--stone);
      aspect-ratio: 3/4;
      margin-bottom: 1.2rem;
    }
    .pcard-img img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      transition: transform 0.6s ease;
    }
    .pcard:hover .pcard-img img { transform: scale(1.05); }

    .pcard-badge {
      position: absolute; top: 1rem; left: 1rem;
      font-size: 0.58rem; letter-spacing: 0.18em; text-transform: uppercase;
      padding: 0.2rem 0.6rem;
      background: var(--white); color: var(--ink);
      font-family: 'Tenor Sans', sans-serif;
    }
    .pcard-badge.sale { background: var(--ink); color: var(--white); }

    .pcard-action {
      position: absolute; bottom: 0; left: 0; right: 0;
      display: flex;
      transform: translateY(101%);
      transition: transform 0.32s ease;
      border-top: 1px solid var(--rule);
    }
    .pcard:hover .pcard-action { transform: none; }

    .action-btn {
      flex: 1; padding: 0.85rem;
      background: rgba(247,245,242,0.97); border: none;
      font-family: 'Tenor Sans', sans-serif;
      font-size: 0.62rem; letter-spacing: 0.18em; text-transform: uppercase;
      color: var(--ink); cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }
    .action-btn:hover { background: var(--ink); color: var(--white); }
    .action-wish {
      flex: 0 0 48px;
      border-left: 1px solid var(--rule);
      font-size: 0.9rem; color: var(--mid);
    }
    .action-wish:hover { background: var(--stone) !important; color: var(--ink) !important; }

    .pcard-sub { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mid); margin-bottom: 0.35rem; }
    .pcard-name {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 1.05rem;
      margin-bottom: 0.4rem; letter-spacing: 0.04em;
    }
    .pcard-price { font-size: 0.8rem; letter-spacing: 0.08em; }
    .old-price { text-decoration: line-through; color: var(--light); margin-left: 0.5rem; }

    /* ---- EDITORIAL ---- */
    .editorial {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 580px;
    }
    .ed-img { overflow: hidden; }
    .ed-img img {
      width: 100%; height: 100%;
      object-fit: cover; display: block;
      filter: saturate(0.75);
      transition: transform 0.8s ease, filter 0.5s;
    }
    .ed-img:hover img { transform: scale(1.04); filter: saturate(1); }
    .ed-text {
      background: var(--stone);
      display: flex; flex-direction: column; justify-content: center;
      padding: 5rem;
    }
    .ed-text h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 2.8rem;
      line-height: 1.15;
      letter-spacing: 0.04em;
      margin-bottom: 1.5rem;
      margin-top: 1.2rem;
    }
    .ed-text h2 em { font-style: italic; }
    .ed-body {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 1rem; color: var(--mid);
      line-height: 1.85;
      margin-bottom: 2.5rem; max-width: 380px;
    }

    /* ---- TESTIMONIALS ---- */
    .testimonials { background: var(--white); }

    .test-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--rule);
      border: 1px solid var(--rule);
      margin-top: 3rem;
    }
    .test-card { background: var(--white); padding: 2.8rem 2.4rem; }
    .test-stars { color: var(--mid); font-size: 0.6rem; letter-spacing: 0.3em; margin-bottom: 1.5rem; }
    .test-quote {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-style: italic;
      font-size: 1.1rem; line-height: 1.7;
      margin-bottom: 1.8rem; color: var(--ink);
    }
    .test-name { font-size: 0.62rem; letter-spacing: 0.2em; text-transform: uppercase; }
    .test-loc { font-size: 0.6rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mid); margin-top: 0.25rem; }

    /* ---- NEWSLETTER ---- */
    .newsletter {
      padding: 7rem 3rem;
      background: var(--ink);
      color: var(--white);
      text-align: center;
    }
    .newsletter .overline { color: var(--mid); }
    .newsletter h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300; font-size: 2.6rem;
      letter-spacing: 0.08em; margin-bottom: 0.8rem;
    }
    .newsletter h2 em { font-style: italic; }
    .newsletter p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      color: var(--mid); font-size: 1rem; margin-bottom: 3rem;
    }
    .nl-form {
      display: flex; max-width: 440px; margin: 0 auto;
    }
    .nl-form input {
      flex: 1; padding: 0.95rem 1.4rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.15); border-right: none;
      color: var(--white);
      font-family: 'Tenor Sans', sans-serif;
      font-size: 0.78rem; letter-spacing: 0.08em;
      outline: none; transition: border-color 0.2s;
    }
    .nl-form input::placeholder { color: var(--mid); }
    .nl-form input:focus { border-color: rgba(255,255,255,0.4); }
    .nl-form button {
      padding: 0.95rem 1.8rem;
      background: var(--white); color: var(--ink);
      border: 1px solid var(--white);
      font-family: 'Tenor Sans', sans-serif;
      font-size: 0.65rem; letter-spacing: 0.2em; text-transform: uppercase;
      cursor: pointer; transition: background 0.25s;
    }
    .nl-form button:hover { background: var(--bg); }

    /* ---- FOOTER ---- */
    footer {
      background: var(--stone);
      padding: 5rem 3rem 2.5rem;
      border-top: 1px solid var(--rule);
    }
    .footer-grid {
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 4rem; margin-bottom: 4rem;
    }
    .footer-logo {
      display: block; margin-bottom: 1.5rem;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem; letter-spacing: 0.28em;
      text-transform: uppercase; text-decoration: none;
      color: var(--ink); font-weight: 300;
    }
    .footer-brand p {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic; font-weight: 300;
      color: var(--mid); font-size: 0.95rem; line-height: 1.8;
      max-width: 240px;
    }
    .footer-col h4 {
      font-size: 0.62rem; letter-spacing: 0.22em; text-transform: uppercase;
      color: var(--ink); margin-bottom: 1.4rem;
      border-bottom: 1px solid var(--rule); padding-bottom: 0.8rem;
    }
    .footer-col ul { list-style: none; }
    .footer-col li { margin-bottom: 0.7rem; }
    .footer-col a {
      text-decoration: none; color: var(--mid);
      font-size: 0.82rem; letter-spacing: 0.06em;
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      transition: color 0.2s;
    }
    .footer-col a:hover { color: var(--ink); }

    .footer-bottom {
      border-top: 1px solid var(--rule); padding-top: 2rem;
      display: flex; justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
    }
    .footer-bottom p { font-size: 0.62rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mid); }

    /* ---- TOAST ---- */
    .toast {
      position: fixed; bottom: 2.5rem; right: 2.5rem;
      background: var(--ink); color: var(--white);
      padding: 1rem 1.8rem;
      font-size: 0.68rem; letter-spacing: 0.18em; text-transform: uppercase;
      z-index: 9999;
      transform: translateY(110%);
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
      border-left: 2px solid var(--light);
    }
    .toast.show { transform: none; }

    /* ---- REVEAL ---- */
    .reveal { opacity: 0; transform: translateY(22px); transition: opacity 0.8s ease, transform 0.8s ease; }
    .reveal.on { opacity: 1; transform: none; }

    /* ---- RESPONSIVE ---- */
    @media (max-width: 960px) {
      nav { grid-template-columns: auto 1fr; padding: 1.2rem 1.5rem; }
      .nav-left { display: none; }
      .nav-logo { text-align: left; }
      .hero { grid-template-columns: 1fr; }
      .hero-left { min-height: 70vw; }
      .hero-right { padding: 3rem 1.5rem; }
      .cat-grid { grid-template-columns: 1fr 1fr; }
      .grid4 { grid-template-columns: 1fr 1fr; }
      .editorial { grid-template-columns: 1fr; }
      .ed-text { padding: 3rem 2rem; }
      .test-grid { grid-template-columns: 1fr; }
      .footer-grid { grid-template-columns: 1fr 1fr; }
      .section { padding: 4rem 1.5rem; }
      .newsletter { padding: 4rem 1.5rem; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <div class="nav-left">
      <a href="#collections">Collections</a>
      <a href="#men">Men</a>
      <a href="#women">Women</a>
    </div>
    <a href="#" class="nav-logo">Johnny</a>
    <div class="nav-right">
      <div class="nav-right-links">
        <a href="#">Search</a>
      </div>
      <button class="nav-cart" id="cartBtn">Bag (0)</button>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-left">
      <img class="hero-img" src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=1000&q=85" alt="" />
      <div class="hero-img-overlay"></div>
      <div class="hero-caption">
        <p class="hero-season">Spring — Summer 2026</p>
        <h2>The New<br><em>Collection</em></h2>
      </div>
    </div>
    <div class="hero-right">
      <div class="hero-right-inner">
        <span class="overline">Johnny Clothing — Est. 2014
