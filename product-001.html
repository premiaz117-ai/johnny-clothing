<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cotton Tee - White | J.I Ateliers</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --white: #FAFAF8;
  --ink: #1C1C1A;
  --mid: #9B9890;
  --light: #E8E6E1;
  --serif: 'DM Serif Display', Georgia, serif;
  --sans: 'DM Sans', sans-serif;
}

html, body {
  background: var(--white);
  color: var(--ink);
  font-family: var(--sans);
  font-weight: 300;
  height: 100%;
}

/* ── HEADER ── */
header {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 40px;
  height: 52px;
  background: var(--white);
  border-bottom: 1px solid var(--light);
}

.logo {
  font-family: var(--serif);
  font-style: italic;
  font-size: 18px;
  letter-spacing: -0.01em;
  color: var(--ink);
}

.header-right {
  display: flex;
  gap: 32px;
  align-items: center;
}

.header-right a, nav a {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--mid);
  text-decoration: none;
  transition: color 0.15s;
  font-weight: 400;
}

.header-right a:hover, nav a:hover { color: var(--ink); }

nav { display: flex; gap: 32px; }

/* ── LAYOUT ── */
main {
  padding-top: 52px;
  min-height: 100vh;
}

/* ── COLLECTIONS NAV ── */
.collections-bar {
  border-bottom: 1px solid var(--light);
  display: flex;
  gap: 0;
  padding: 0 40px;
  overflow-x: auto;
  scrollbar-width: none;
}

.collections-bar::-webkit-scrollbar { display: none; }

.col-tab {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mid);
  padding: 16px 24px 14px;
  cursor: pointer;
  border-bottom: 1px solid transparent;
  transition: color 0.15s, border-color 0.15s;
  white-space: nowrap;
  background: none;
  border-top: none;
  border-left: none;
  border-right: none;
  font-family: var(--sans);
  font-weight: 400;
  margin-bottom: -1px;
}

.col-tab:hover { color: var(--ink); }
.col-tab.active {
  color: var(--ink);
  border-bottom-color: var(--ink);
}

/* ── PRODUCT GRID ── */
.grid-wrap {
  padding: 48px 40px 80px;
}

.product-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 2px;
}

@media (max-width: 900px) {
  .product-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 768px) {
  header {
    padding: 0 20px;
    height: 48px;
  }
  .logo {
    font-size: 16px;
  }
  .header-right, nav {
    gap: 16px;
  }
  .header-right a, nav a {
    font-size: 10px;
  }
  .collections-bar {
    padding: 0 20px;
  }
  .col-tab {
    padding: 12px 16px 10px;
    font-size: 10px;
  }
  .grid-wrap {
    padding: 24px 20px 40px;
  }
  .product-info {
    padding: 10px 0 16px;
  }
  .product-name, .product-price {
    font-size: 12px;
  }
  .product-num {
    font-size: 9px;
  }
  .product-color {
    font-size: 11px;
  }
  footer {
    padding: 24px 20px;
    flex-direction: column;
    gap: 16px;
  }
  .footer-links {
    gap: 16px;
  }

  .product-detail {
    flex-direction: column;
    padding: 24px 20px;
    gap: 24px;
  }

  .product-image img {
    max-width: 100%;
  }
}

.product-card {
  cursor: pointer;
  position: relative;
}

.product-img-wrap {
  aspect-ratio: 3/4;
  background: #EEECEA;
  overflow: hidden;
  position: relative;
}

.product-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: center;
  transform: scale(1.45); /* zoom in to crop out empty space */
}

.product-card:hover .product-img-wrap img {
  transform: scale(1.03);
}

/* Placeholder for cards without images */
.product-img-wrap.no-img {
  display: flex;
  align-items: center;
  justify-content: center;
}

.no-img-label {
  font-family: var(--serif);
  font-style: italic;
  font-size: 13px;
  color: rgba(26,26,26,0.18);
}

.product-info {
  padding: 14px 0 20px;
}

.product-num {
  font-size: 10px;
  letter-spacing: 0.2em;
  color: var(--mid);
  margin-bottom: 4px;
}

.product-name {
  font-size: 13px;
  font-weight: 400;
  color: var(--ink);
  margin-bottom: 3px;
  letter-spacing: 0.01em;
}

.product-color {
  font-size: 12px;
  color: var(--mid);
  margin-bottom: 8px;
}

.product-price {
  font-size: 13px;
  color: var(--ink);
  font-weight: 400;
}

/* Quick add on hover */
.quick-add {
  position: absolute;
  bottom: 0; left: 0; right: 0;
  background: var(--ink);
  color: var(--white);
  font-family: var(--sans);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  font-weight: 400;
  padding: 13px;
  text-align: center;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.2s, transform 0.2s;
  cursor: pointer;
  border: none;
}

.product-img-wrap:hover .quick-add {
  opacity: 1;
  transform: translateY(0);
}

/* ── FILTER ROW ── */
.filter-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 32px;
}

.filter-count {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--mid);
}

.filter-sort {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--mid);
  cursor: pointer;
  background: none;
  border: none;
  font-family: var(--sans);
  display: flex;
  align-items: center;
  gap: 6px;
  transition: color 0.15s;
}

.filter-sort:hover { color: var(--ink); }

/* ── FOOTER ── */
footer {
  border-top: 1px solid var(--light);
  padding: 32px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.footer-logo {
  font-family: var(--serif);
  font-style: italic;
  font-size: 15px;
  color: var(--ink);
}

.footer-meta {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--mid);
}

.footer-links {
  display: flex;
  gap: 24px;
}

.footer-links a {
  font-size: 11px;
  letter-spacing: 0.06em;
  color: var(--mid);
  text-decoration: none;
  transition: color 0.15s;
}

.footer-links a:hover { color: var(--ink); }

.product-detail {
  display: flex;
  padding: 48px 40px;
  gap: 40px;
  align-items: flex-start;
}

.product-image {
  flex: 1;
}

.product-image img {
  width: 100%;
  max-width: 500px;
  height: auto;
}

.product-details {
  flex: 1;
}

.product-details h1 {
  font-family: var(--serif);
  font-size: 24px;
  margin-bottom: 16px;
  font-weight: 400;
}

.add-to-bag {
  background: var(--ink);
  color: var(--white);
  border: none;
  padding: 12px 24px;
  font-family: var(--sans);
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  cursor: pointer;
  margin-top: 16px;
}

.product-details .product-num {
  font-size: 16px;
  margin-bottom: 8px;
}

.back-link {
  font-size: 12px;
  color: var(--mid);
  text-decoration: none;
  margin-bottom: 24px;
  display: block;
  transition: color 0.15s;
}

.back-link:hover { color: var(--ink); }

</style>
</head>
<body>

<header>
  <div class="logo">J.I Ateliers</div>
  <nav>
    <a href="#">Women</a>
    <a href="#">Men</a>
    <a href="index.html">Collections</a>
  </nav>
  <div class="header-right">
    <a href="#">Search</a>
    <a href="#">Bag (0)</a>
  </div>
</header>

<main>

  <a href="index.html" class="back-link">&larr; Back to collection</a>

  <div class="product-detail">

    <div class="product-image">

      <img src="001.jpg" alt="Cotton Tee">

    </div>

    <div class="product-details">

      <p class="product-num">Cotton Tee</p>

      <h1 class="product-name">001</h1>

      <p class="product-color">White</p>

      <p class="product-price">849 SEK</p>

      <button class="add-to-bag">Add to bag</button>

    </div>

  </div>

</main>

<footer>
  <span class="footer-logo">J.I Ateliers</span>
  <span class="footer-meta">Est. 2026 — Göteborg</span>
  <div class="footer-links">
    <a href="#">Instagram</a>
    <a href="#">Shipping</a>
    <a href="#">Returns</a>
  </div>
</footer>


</body>
</html>
